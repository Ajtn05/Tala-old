<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"
    />
    <title>Tala</title>
    <style>
      /*STYLE*/
    </style>
  </head>
  <body>
    <div id="app">
      <aside aria-label="Navigation">
        <div class="brand"><span class="mark">/*LOGO*/</span>Tala</div>
        <button class="new-button" data-nav="new">
          <span class="nav-icon" data-icon="plus" aria-hidden="true"></span> New
          transcription <kbd>⌘ N</kbd>
        </button>
        <nav>
          <button id="active-recording" hidden>
            <span class="nav-icon" data-icon="record" aria-hidden="true"></span
            >Recording in progress<span id="live-dot"></span>
          </button>
          <button data-nav="queue">
            <span class="nav-icon" data-icon="queue" aria-hidden="true"></span
            >Processing queue<span id="queue-count" class="count"></span>
          </button>
        </nav>
        <div class="sidebar-heading">
          <span>Sessions</span
          ><button
            id="all-history"
            class="text-button"
            aria-label="View all sessions"
          >
            View all
          </button>
        </div>
        <div id="recent" class="recent"></div>
        <div class="sidebar-bottom">
          <button data-nav="settings">
            <span
              class="nav-icon"
              data-icon="settings"
              aria-hidden="true"
            ></span
            >Settings<span id="model-dot" class="status-dot"></span>
          </button>
        </div>
      </aside>
      <main>
        <header>
          <div id="breadcrumb">Workspace</div>
          <div class="header-actions">
            <span id="activity"></span
            ><button
              id="pin"
              class="pin-button"
              title="Always on top"
              aria-label="Always on top"
              aria-pressed="false"
            >
              <span class="nav-icon" data-icon="pin" aria-hidden="true"></span>
              Keep on top
            </button>
          </div>
        </header>
        <div id="content" tabindex="-1"></div>
        <div
          id="session-tools"
          role="toolbar"
          aria-label="Transcript export"
          hidden
        ></div>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="error" role="alert" hidden>
      <span></span><button aria-label="Dismiss error">×</button>
    </div>
    <script>
      window.onerror = function (message, source, line, col) {
        document.getElementById("error").hidden = false;
        document.querySelector("#error span").textContent =
          String(message) + " at " + line + ":" + col;
      };
    </script>
    <script>
      /*SCRIPT*/
    </script>
  </body>
</html>
