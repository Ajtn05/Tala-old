name: Build DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "icons/**"
      - "WHISPER_VERSION"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            third_party/whisper.cpp/build
            third_party/portaudio/build
          key: native-${{ runner.arch }}-${{ hashFiles('WHISPER_VERSION', 'scripts/setup-deps.sh') }}

      - name: Build pinned native dependencies
        run: make setup

      - name: Run tests
        run: make test

      - name: Build DMG
        run: bash scripts/package.sh

      - name: Determine version
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            echo "tag=${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kian Studio ${{ steps.version.outputs.tag }}
          files: dist/Kian-Studio.dmg
          generate_release_notes: true
