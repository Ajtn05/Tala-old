name: Build DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "icons/**"
      - "WHISPER_VERSION"

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Linux build and media dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libasound2-dev ffmpeg
      - name: Cache native Linux builds
        uses: actions/cache@v4
        with:
          path: |
            third_party/whisper.cpp/build
            third_party/portaudio/build
          key: native-linux-${{ runner.arch }}-${{ hashFiles('WHISPER_VERSION', 'scripts/setup-deps.sh') }}
      - name: Build and test headless CLI
        run: |
          make setup
          make test
          make test-ui
          make race
          make build
          ./tala --help
          TALA_DATA_DIR="$RUNNER_TEMP/tala-data" ./tala --output "$RUNNER_TEMP/tala-output" --list
      - name: Package Linux CLI
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: tala-linux-x86_64
          path: dist/tala-linux-x86_64.tar.gz
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            third_party/whisper.cpp/build
            third_party/portaudio/build
          key: native-${{ runner.arch }}-${{ hashFiles('WHISPER_VERSION', 'scripts/setup-deps.sh') }}

      - name: Build pinned native dependencies
        run: make setup

      - name: Run tests
        run: |
          make test
          make test-ui

      - name: Build DMG
        run: bash scripts/package.sh

      - name: Determine version
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            echo "tag=${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tala ${{ steps.version.outputs.tag }}
          files: dist/Tala.dmg
          generate_release_notes: true
