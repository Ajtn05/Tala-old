name: Build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build.yml"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "icons/**"
      - "WHISPER_VERSION"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Linux build and media dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libasound2-dev ffmpeg
      - name: Cache native Linux builds
        uses: actions/cache@v4
        with:
          path: |
            third_party/whisper.cpp/build
            third_party/portaudio/build
          key: native-linux-${{ runner.arch }}-${{ hashFiles('WHISPER_VERSION', 'scripts/setup-deps.sh') }}
      - name: Build and test headless CLI
        run: |
          make setup
          make test
          make test-ui
          make race
          make build
          ./tala --help
          TALA_DATA_DIR="$RUNNER_TEMP/tala-data" ./tala --output "$RUNNER_TEMP/tala-output" --list
      - name: Package Linux CLI
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: tala-linux-x86_64
          path: dist/tala-linux-x86_64.tar.gz
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            third_party/whisper.cpp/build
            third_party/portaudio/build
          key: native-${{ runner.arch }}-${{ hashFiles('WHISPER_VERSION', 'scripts/setup-deps.sh') }}

      - name: Build pinned native dependencies
        run: make setup

      - name: Run tests
        run: |
          make test
          make test-ui
          make race

      - name: Set release bundle version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "TALA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build DMG
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tala-macos
          path: dist/Tala.dmg

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tala-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tala-linux-x86_64
          path: dist
      - name: Generate download checksums
        working-directory: dist
        run: sha256sum Tala.dmg tala-linux-x86_64.tar.gz > SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Tala ${{ github.ref_name }}
          files: |
            dist/Tala.dmg
            dist/tala-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
