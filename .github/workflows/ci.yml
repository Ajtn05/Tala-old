name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "WHISPER_VERSION"

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check native setup recovery
        run: make test-setup

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            third_party/whisper.cpp
            third_party/portaudio
            third_party/portaudio_static
          key: native-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('WHISPER_VERSION', 'scripts/setup-deps.sh') }}

      - name: Build pinned native dependencies
        run: make setup

      - name: Run tests
        run: make test

      - name: Race checks
        run: make race

      - name: Build
        run: make build
