<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="roundRect">
      <rect width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#roundRect)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Microphone body -->
    <rect x="390" y="120" width="180" height="310" rx="90" ry="90" fill="none" stroke="#e8e8e8" stroke-width="42"/>

    <!-- Microphone arc -->
    <path d="M290 380 Q290 560 480 560 Q670 560 670 380" fill="none" stroke="#e8e8e8" stroke-width="42" stroke-linecap="round"/>

    <!-- Microphone stand -->
    <line x1="480" y1="560" x2="480" y2="660" stroke="#e8e8e8" stroke-width="42" stroke-linecap="round"/>

    <!-- Text lines representing transcription -->
    <line x1="260" y1="740" x2="700" y2="740" stroke="#e44" stroke-width="34" stroke-linecap="round"/>
    <line x1="300" y1="810" x2="660" y2="810" stroke="#e44" stroke-width="34" stroke-linecap="round" opacity="0.7"/>
    <line x1="340" y1="880" x2="620" y2="880" stroke="#e44" stroke-width="34" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
